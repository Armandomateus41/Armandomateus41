<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" role="img" aria-labelledby="titulo">
  <title id="titulo">Armando Capita · Engenheiro de Software Sênior Full Stack</title>
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1020"/>
      <stop offset="1" stop-color="#111d38"/>
    </linearGradient>
    <linearGradient id="acento" gradientUnits="userSpaceOnUse" x1="50" y1="0" x2="430" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="brilho" x1="0" x2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="cantos"><rect width="1000" height="240" rx="20"/></clipPath>
  </defs>
  <style>
    .t { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
    .m { font-family: "Cascadia Code", "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
    .entra { opacity: 0; animation: entra .8s cubic-bezier(.2,.7,.2,1) forwards; }
    .nome { animation-delay: .1s; }
    .cargo { animation-delay: .35s; }
    .linha { stroke-dasharray: 380; stroke-dashoffset: 380; animation: traca 1.1s ease-out .7s forwards; }
    .brilho { animation: corre 7s linear 1.5s infinite; }
    .l1 { animation-delay: 1.2s; } .l2 { animation-delay: 1.9s; } .l3 { animation-delay: 2.6s; }
    .cursor { animation: pisca 1s steps(1) 3.2s infinite; opacity: 0; }
    .ponto { animation: pulsa 2.4s ease-in-out 3s infinite; }
    @keyframes entra { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    @keyframes traca { to { stroke-dashoffset: 0; } }
    @keyframes corre { from { transform: translateX(-700px); } to { transform: translateX(1100px); } }
    @keyframes pisca { 0% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes pulsa { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
    @media (prefers-reduced-motion: reduce) {
      .entra, .cursor { animation: none; opacity: 1; }
      .linha { animation: none; stroke-dashoffset: 0; }
      .brilho, .ponto { animation: none; }
    }
  </style>

  <g clip-path="url(#cantos)">
    <rect width="1000" height="240" fill="url(#fundo)"/>
    <rect class="brilho" x="0" y="0" width="420" height="240" fill="url(#brilho)"/>
    <rect x="0.5" y="0.5" width="999" height="239" rx="19.5" fill="none" stroke="#ffffff" stroke-opacity=".08"/>
  </g>

  <text class="t entra nome" x="48" y="112" fill="#ffffff" font-size="54" font-weight="700" letter-spacing="-1.2">Armando Capita</text>
  <text class="t entra cargo" x="50" y="156" fill="#a9b8d8" font-size="23" font-weight="500">Engenheiro de Software Sênior Full Stack</text>
  <path class="linha" d="M50 184 H430" stroke="url(#acento)" stroke-width="3" stroke-linecap="round" fill="none"/>

  <g transform="translate(612 44)">
    <rect width="344" height="152" rx="12" fill="#070c18" stroke="#ffffff" stroke-opacity=".1"/>
    <circle cx="20" cy="20" r="5" fill="#ff5f57"/>
    <circle cx="38" cy="20" r="5" fill="#febc2e"/>
    <circle cx="56" cy="20" r="5" fill="#28c840"/>
    <text class="m entra l1" x="20" y="62" fill="#7dd3fc" font-size="15">~/produtos <tspan fill="#8b9bb8">no ar</tspan></text>
    <text class="m entra l2" x="20" y="94" font-size="15"><tspan class="ponto" fill="#4ade80">●</tspan><tspan fill="#e2e8f0" dx="8">AfroPedido</tspan><tspan fill="#8b9bb8" x="186">web · android</tspan></text>
    <text class="m entra l3" x="20" y="124" font-size="15"><tspan class="ponto" fill="#4ade80">●</tspan><tspan fill="#e2e8f0" dx="8">Ondela</tspan><tspan fill="#8b9bb8" x="186">web · android</tspan></text>
    <rect class="cursor" x="20" y="134" width="9" height="3" fill="#e2e8f0"/>
  </g>
</svg>
